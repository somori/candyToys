<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>くじ更新チェッカー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: #f7f5f0; min-height: 100vh;
    padding: 20px;
  }
  h1 {
    font-size: 20px; font-weight: 800; text-align: center;
    margin-bottom: 6px; color: #222;
  }
  .subtitle {
    text-align: center; color: #888; font-size: 13px; margin-bottom: 24px;
  }
  .cards { display: flex; flex-direction: column; gap: 12px; max-width: 480px; margin: 0 auto; }
  .card {
    background: white; border-radius: 16px; padding: 16px 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: inherit;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  .icon { font-size: 32px; flex-shrink: 0; }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .status-text { font-size: 12px; color: #888; }
  .badge {
    padding: 5px 12px; border-radius: 99px; font-size: 12px;
    font-weight: 700; white-space: nowrap; flex-shrink: 0;
  }
  .badge-changed { background: #ffe0e0; color: #c0392b; }
  .badge-same    { background: #e0f5e0; color: #1a7a3a; }
  .badge-first   { background: #e8e8e8; color: #555; }
  .badge-error   { background: #fff3cd; color: #856404; }
  .badge-loading { background: #e8f0fe; color: #1a73e8; }
  .btn {
    display: block; max-width: 480px; margin: 20px auto 0;
    background: #ff6b35; color: white; border: none; border-radius: 12px;
    padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer;
    text-align: center;
  }
  .btn:hover { background: #e55a25; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .last-checked {
    text-align: center; color: #aaa; font-size: 11px; margin-top: 12px;
  }
</style>
</head>
<body>

<h1>🎀 くじ更新チェッカー</h1>
<p class="subtitle">各くじサイトに更新があったか確認します</p>

<div class="cards" id="cards">
  <div class="card">
    <div class="icon">🎀</div>
    <div class="info"><div class="name">一番くじ</div><div class="status-text">読み込み中...</div></div>
    <span class="badge badge-loading">確認中</span>
  </div>
  <div class="card">
    <div class="icon">🎀</div>
    <div class="info"><div class="name">エニマイくじ</div><div class="status-text">読み込み中...</div></div>
    <span class="badge badge-loading">確認中</span>
  </div>
  <div class="card">
    <div class="icon">🎀</div>
    <div class="info"><div class="name">ちいかわくじ</div><div class="status-text">読み込み中...</div></div>
    <span class="badge badge-loading">確認中</span>
  </div>
</div>

<button class="btn" id="checkBtn" onclick="check()">🔍 今すぐチェック</button>
<p class="last-checked" id="lastChecked"></p>

<script>
const WORKER_URL = 'https://candytoys-scraper-test.somori.workers.dev';

function formatDate(ts) {
  if (!ts) return '未確認';
  return new Date(ts).toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function renderCards(results) {
  const container = document.getElementById('cards');
  container.innerHTML = results.map(r => {
    const statusMap = {
      changed: { badge: 'badge-changed', text: '更新あり！', icon: '🎀' },
      same:    { badge: 'badge-same',    text: '変更なし',   icon: '✅' },
      first:   { badge: 'badge-first',   text: '初回確認',   icon: '🆕' },
      error:   { badge: 'badge-error',   text: 'エラー',     icon: '⚠️' },
    };
    const s = statusMap[r.status] || statusMap.error;
    return `
      <a class="card" href="${r.link}" target="_blank">
        <div class="icon">${s.icon}</div>
        <div class="info">
          <div class="name">${r.name}</div>
          <div class="status-text">確認: ${formatDate(r.checkedAt)}${r.error ? ' / ' + r.error : ''}</div>
        </div>
        <span class="badge ${s.badge}">${s.text}</span>
      </a>`;
  }).join('');
}

async function check() {
  const btn = document.getElementById('checkBtn');
  btn.disabled = true;
  btn.textContent = '確認中...';

  // ローディング表示
  document.getElementById('cards').innerHTML = ['一番くじ','エニマイくじ','ちいかわくじ'].map(name => `
    <div class="card">
      <div class="icon">🎀</div>
      <div class="info"><div class="name">${name}</div><div class="status-text">確認中...</div></div>
      <span class="badge badge-loading">確認中</span>
    </div>`).join('');

  try {
    const res = await fetch(`${WORKER_URL}?mode=kuji`);
    const results = await res.json();
    renderCards(results);
    document.getElementById('lastChecked').textContent = `最終確認: ${new Date().toLocaleString('ja-JP')}`;

    // 更新ありなら通知
    const changed = results.filter(r => r.status === 'changed');
    if (changed.length > 0 && 'Notification' in window && Notification.permission === 'granted') {
      new Notification('くじ更新あり！', { body: changed.map(r => r.name).join('・') + ' に更新があります' });
    }
  } catch(e) {
    document.getElementById('cards').innerHTML = `<div class="card"><div class="icon">⚠️</div><div class="info"><div class="name">エラー</div><div class="status-text">${e.message}</div></div></div>`;
  }

  btn.disabled = false;
  btn.textContent = '🔍 今すぐチェック';
}

// 初回自動チェック
check();
</script>
</body>
</html>
